<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Bracket Generator</title>
<style>
  :root{
    --bg:#f7f6f4;
    --panel:#ffffff;
    --card:#fbfaf8;
    --card-2:#f6f4f0;
    --line:#e7e2d9;
    --line-soft:#ece8e0;
    --text:#2f2f33;
    --muted:#8d877d;
    --seed-bg:#e6edf7;
    --seed-fg:#4a6d9c;
    --ava-bg:#ece4d8;
    --ava-fg:#6f6355;
    --ava-bg-2:#e2e8f0;
    --ava-fg-2:#5b6b80;
    --accent:#3f7d5c;
    --accent-bg:#e8f2ec;
    --shadow:0 1px 2px rgba(40,34,24,.05), 0 8px 24px rgba(40,34,24,.05);
    --radius:14px;
  }
  :root[data-theme="dark"]{
    --bg:#16151a;
    --panel:#1d1c22;
    --card:#232228;
    --card-2:#1f1e24;
    --line:#33313a;
    --line-soft:#2b2a32;
    --text:#eceaf1;
    --muted:#8e8a99;
    --seed-bg:#22314a;
    --seed-fg:#9dbbe6;
    --ava-bg:#3a3327;
    --ava-fg:#d8c7a8;
    --ava-bg-2:#2b3340;
    --ava-fg-2:#a9bcd4;
    --accent:#6fc79a;
    --accent-bg:#1e3a2c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  }

  header{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
  .brand small{display:block;font-weight:450;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
  .spacer{flex:1}

  .btn{
    appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:7px 13px;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;
    transition:.15s ease;white-space:nowrap;
  }
  .btn:hover{background:var(--card-2);border-color:var(--muted)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  .btn.primary:hover{opacity:.88;background:var(--text)}
  .btn.icon{padding:7px 10px;font-size:14px;line-height:1}

  .wrap{flex:1;display:flex;min-height:0}
  aside{width:320px;flex:none;padding:18px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
  aside.hidden{display:none}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  textarea{
    width:100%;height:210px;resize:vertical;padding:11px 12px;border:1px solid var(--line);
    border-radius:11px;background:var(--card);color:var(--text);
    font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  textarea:focus,select:focus{outline:2px solid var(--seed-fg);outline-offset:1px}
  select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--card);color:var(--text);font-size:13.5px}
  .hint{font-size:12px;color:var(--muted);margin-top:7px}
  .hint code{background:var(--card-2);border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;font-size:11.5px}
  .row{display:flex;gap:8px}
  .row .btn{flex:1;text-align:center}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .stat b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

  /* таблица посева, как в исходной табличке «Пара — Композит» */
  .seedlist{border-top:1px solid var(--line);margin-top:4px}
  .seedlist .r{display:flex;align-items:center;gap:9px;padding:8px 2px;
    border-bottom:1px solid var(--line-soft);font-size:13.5px}
  .seedlist .r i{font-style:normal;min-width:20px;height:20px;border-radius:6px;display:grid;
    place-items:center;background:var(--seed-bg);color:var(--seed-fg);font-size:11px;font-weight:600}
  .seedlist .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seedlist .r em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}

  .canvas{flex:1;overflow:auto;position:relative;padding:34px 44px 60px}
  .zoomer{transform-origin:0 0;transition:transform .12s ease}
  .bracket{display:flex;align-items:stretch;gap:120px;position:relative;width:max-content;min-height:100%}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  svg.links path{fill:none;stroke:var(--line);stroke-width:1.5}
  svg.links path.done{stroke:var(--accent);opacity:.55}

  .round{display:flex;flex-direction:column;justify-content:space-around;gap:22px;position:relative;z-index:1}
  .round-title{position:absolute;top:-26px;left:2px;font-size:11px;font-weight:650;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

  .match{
    width:310px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;transition:.18s ease;
  }
  .match:hover{border-color:var(--muted)}
  .match.live{border-color:var(--seed-fg)}
  .match.champion{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg),var(--shadow)}
  .match-head{
    padding:9px 14px 8px;font-size:12.5px;color:var(--muted);letter-spacing:.02em;
    border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .match-head .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-bg);padding:2px 6px;border-radius:5px}

  .slot{
    display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;
    border-top:1px solid var(--line-soft);position:relative;transition:background .13s ease;
  }
  .slot:first-of-type{border-top:0}
  .slot:hover{background:var(--card-2)}
  .slot.tbd,.slot.bye{cursor:default}
  .slot.tbd:hover{background:transparent}
  .slot.win{background:var(--accent-bg)}
  .slot.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .slot.lose{opacity:.42}

  .seed{flex:none;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:var(--seed-bg);color:var(--seed-fg);font-size:12px;font-weight:600;padding:0 5px}

  /* два аватара команды «внахлёст» */
  .duo{flex:none;display:flex}
  .duo .ava{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    font-size:12px;font-weight:600;text-transform:uppercase;
    background:var(--ava-bg);color:var(--ava-fg);box-shadow:0 0 0 2px var(--card);
  }
  .slot.win .duo .ava{box-shadow:0 0 0 2px var(--accent-bg)}
  .duo .ava+.ava{margin-left:-9px;background:var(--ava-bg-2);color:var(--ava-fg-2)}

  .team{flex:1;min-width:0}
  .team .nm{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team .nm .plus{color:var(--muted);margin:0 3px}
  .team .sub{font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:1px}
  .slot.win .team .nm{font-weight:600}
  .slot.tbd .team .nm{font-style:italic;color:var(--muted)}

  .rate{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .slot.win .rate{color:var(--accent)}
  .check{flex:none;color:var(--accent);font-size:14px;opacity:0;width:12px}
  .slot.win .check{opacity:1}

  .empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;
    display:flex;flex-direction:column;gap:6px;align-items:center}
  .empty b{font-size:16px;color:var(--text)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:.2s ease;z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:860px){
    aside{position:absolute;z-index:20;height:calc(100% - 57px);top:57px;box-shadow:var(--shadow)}
    .canvas{padding:34px 20px 60px}
  }
  @media print{header,aside{display:none}.canvas{overflow:visible}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <span>Team Bracket<small>сетка для команд 2×2</small></span>
  </div>
  <div class="spacer"></div>
  <button class="btn icon" id="toggleSide" title="Панель настроек">☰</button>
  <button class="btn" id="simulate">🎲 Симулировать</button>
  <button class="btn" id="clearWins">Сбросить результаты</button>
  <button class="btn icon" id="zoomOut" title="Уменьшить">−</button>
  <button class="btn icon" id="zoomIn" title="Увеличить">+</button>
  <button class="btn icon" id="theme" title="Тема">◐</button>
</header>

<div class="wrap">
  <aside id="side">
    <div class="stats">
      <div class="stat"><b id="stTeams">0</b><span>команд</span></div>
      <div class="stat"><b id="stRounds">0</b><span>раундов</span></div>
    </div>

    <div class="field">
      <label for="names">Команды — одна пара в строке</label>
      <textarea id="names" spellcheck="false"></textarea>
      <div class="hint">
        Формат: <code>игрок + игрок</code>, композит — через <code>|</code> или числом в конце строки.<br>
        Пример: <code>kto + Фионка | 0.35</code>
      </div>
      <div class="hint" id="cnt">—</div>
    </div>

    <div class="field">
      <label for="mode">Посев</label>
      <select id="mode">
        <option value="rate">По композиту (сильный ↔ слабый)</option>
        <option value="seed">По порядку списка (1–8, 4–5, 2–7, 3–6)</option>
        <option value="order">Парами подряд (1–2, 3–4, …)</option>
        <option value="random">Случайный</option>
      </select>
    </div>

    <div class="field row">
      <button class="btn primary" id="generate">Сгенерировать</button>
      <button class="btn" id="shuffle">Перемешать</button>
    </div>

    <div class="field row">
      <button class="btn" id="exportJson">Экспорт JSON</button>
      <button class="btn" id="printBtn">Печать</button>
    </div>

    <div class="field">
      <label>Посев команд</label>
      <div class="seedlist" id="seedlist"></div>
    </div>
  </aside>

  <main class="canvas" id="canvas">
    <div class="zoomer" id="zoomer">
      <div class="bracket" id="bracket"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);

  const DEFAULT = [
    "kto + Фионка | 0.35",
    "Дайвер + きつね | 0.32",
    "Alice + cipher | 0.22",
    "ikoshka + Kinder | 0.20"
  ].join("\n");

  const el = {
    names: $("#names"), bracket: $("#bracket"), zoomer: $("#zoomer"), mode: $("#mode"),
    cnt: $("#cnt"), toast: $("#toast"), seedlist: $("#seedlist"),
    stTeams: $("#stTeams"), stRounds: $("#stRounds"), side: $("#side")
  };

  let state = { teams: [], rounds: [] };  // rounds[r][m] = {p:[team|null, team|null], win, bye}
  let zoom = 1;

  /* ---------------- helpers ---------------- */
  const toast = msg => {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove("show"), 1800);
  };

  const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  /* «kto + Фионка | 0.35» → {a:"kto", b:"Фионка", rate:0.35} */
  function parseTeams(){
    return el.names.value.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
      let rate = null, s = line;

      const bar = s.lastIndexOf("|");
      if (bar > -1) {
        const v = parseFloat(s.slice(bar + 1).replace(",", ".").trim());
        if (!isNaN(v)) { rate = v; s = s.slice(0, bar).trim(); }
      } else {
        const m = s.match(/[\s\t](\d+[.,]?\d*)$/);        // число в конце строки
        if (m) { rate = parseFloat(m[1].replace(",", ".")); s = s.slice(0, m.index).trim(); }
      }

      const parts = s.split(/\s*[+&/]\s*|\s{2,}|\t+/).map(x => x.trim()).filter(Boolean);
      return { a: parts[0] || s, b: parts[1] || "", rate };
    });
  }

  const teamName = t => t.b ? `${t.a} + ${t.b}` : t.a;

  // 1, 8, 4, 5, 2, 7, 3, 6 …
  function seedOrder(size){
    let a = [1];
    while (a.length < size) {
      const m = a.length * 2 + 1, next = [];
      for (const s of a) next.push(s, m - s);
      a = next;
    }
    return a;
  }
  const nextPow2 = n => { let p = 1; while (p < n) p *= 2; return Math.max(p, 2); };

  /* ---------------- build ---------------- */
  function build(){
    const raw = parseTeams();
    if (raw.length < 2) { toast("Нужно минимум 2 команды"); return; }

    let list = raw.slice();
    if (el.mode.value === "rate") {
      list.sort((x, y) => (y.rate ?? -Infinity) - (x.rate ?? -Infinity));
    } else if (el.mode.value === "random") {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
    }
    list = list.map((t, i) => ({ ...t, seed: i + 1, name: teamName(t) }));

    const size = nextPow2(list.length);
    const order = el.mode.value === "order"
      ? Array.from({ length: size }, (_, i) => i + 1)
      : seedOrder(size);

    const first = [];
    for (let i = 0; i < size; i += 2) {
      first.push({ p: [ list[order[i] - 1] || null, list[order[i + 1] - 1] || null ], win: null, bye: false });
    }

    const rounds = [first];
    for (let n = first.length; n > 1; n = Math.ceil(n / 2)) {
      const cnt = Math.ceil(n / 2);
      rounds.push(Array.from({ length: cnt }, () => ({ p: [null, null], win: null, bye: false })));
    }

    state = { teams: list, rounds };
    autoByes();
    render(); save();
  }

  function autoByes(){
    state.rounds[0].forEach((m, i) => {
      const [a, b] = m.p;
      if (a && !b) { m.win = 0; m.bye = true; promote(0, i); }
      else if (!a && b) { m.win = 1; m.bye = true; promote(0, i); }
    });
  }

  function promote(r, i){
    const nr = state.rounds[r + 1];
    if (!nr) return;
    const m = state.rounds[r][i];
    nr[Math.floor(i / 2)].p[i % 2] = m.win === null ? null : m.p[m.win];
  }

  function clearDownstream(r, i){
    let cr = r, ci = i;
    while (state.rounds[cr + 1]) {
      const ni = Math.floor(ci / 2);
      const nm = state.rounds[cr + 1][ni];
      nm.p[ci % 2] = null;
      if (nm.win !== null) { nm.win = null; nm.bye = false; }
      cr++; ci = ni;
    }
  }

  function pick(r, i, s){
    const m = state.rounds[r][i];
    if (!m.p[s] || m.bye) return;
    m.win = (m.win === s) ? null : s;
    clearDownstream(r, i);
    promote(r, i);
    render(); save();
  }

  /* ---------------- render ---------------- */
  const ini = n => (n || "").trim().charAt(0);

  function duo(t){
    return `<span class="duo"><span class="ava">${escapeHtml(ini(t.a)) || "?"}</span>` +
      (t.b ? `<span class="ava">${escapeHtml(ini(t.b))}</span>` : "") + `</span>`;
  }

  function slotEl(t, r, i, s){
    const m = state.rounds[r][i];
    const d = document.createElement("div");
    d.className = "slot" + (t ? "" : " tbd") +
      (m.win === s ? " win" : "") + (m.win !== null && m.win !== s && t ? " lose" : "");

    if (t) {
      d.innerHTML =
        `<span class="seed">${t.seed}</span>` + duo(t) +
        `<span class="team"><div class="nm">${escapeHtml(t.a)}` +
          (t.b ? `<span class="plus">+</span>${escapeHtml(t.b)}` : "") + `</div>` +
          `<div class="sub">${m.bye ? "проход без игры" : "команда #" + t.seed}</div></span>` +
        (t.rate != null ? `<span class="rate">${t.rate.toFixed(2)}</span>` : "") +
        `<span class="check">✓</span>`;
    } else {
      d.innerHTML =
        `<span class="seed">-</span>` +
        `<span class="duo"><span class="ava">?</span><span class="ava">?</span></span>` +
        `<span class="team"><div class="nm">TBD</div>` +
        `<div class="sub">победитель предыдущего матча</div></span><span class="check">✓</span>`;
    }
    if (t && !m.bye) d.addEventListener("click", () => pick(r, i, s));
    return d;
  }

  function roundName(r, total){
    const left = total - r;
    if (left === 1) return "Финал";
    if (left === 2) return "Полуфинал";
    if (left === 3) return "1/4 финала";
    return "Раунд " + (r + 1);
  }

  function render(){
    el.bracket.innerHTML = "";
    const R = state.rounds.length;

    if (!R) {
      el.bracket.innerHTML =
        `<div class="empty"><b>Сетка пуста</b><span>Введите команды и нажмите «Сгенерировать»</span></div>`;
      el.stTeams.textContent = 0; el.stRounds.textContent = 0;
      renderSeedList(); return;
    }

    state.rounds.forEach((round, r) => {
      const col = document.createElement("div");
      col.className = "round";
      col.innerHTML = `<div class="round-title">${roundName(r, R)}</div>`;

      round.forEach((m, i) => {
        const card = document.createElement("div");
        card.className = "match";
        card.dataset.r = r; card.dataset.i = i;
        const ready = m.p[0] && m.p[1] && m.win === null;
        if (ready) card.classList.add("live");

        const head = document.createElement("div");
        head.className = "match-head";
        head.innerHTML = `<span>R${r + 1} · M${i + 1}</span>` +
          (m.bye ? `<span class="tag">bye</span>` : ready ? `<span class="tag">идёт</span>` : "");
        card.appendChild(head);
        card.appendChild(slotEl(m.p[0], r, i, 0));
        card.appendChild(slotEl(m.p[1], r, i, 1));
        col.appendChild(card);
      });
      el.bracket.appendChild(col);
    });

    const fin = state.rounds[R - 1][0];
    if (fin.win !== null && fin.p[fin.win]) {
      const t = fin.p[fin.win];
      const col = document.createElement("div");
      col.className = "round";
      col.innerHTML = `<div class="round-title">Победитель</div>`;
      const card = document.createElement("div");
      card.className = "match champion";
      card.innerHTML =
        `<div class="match-head"><span>🏆 Чемпионы</span></div>` +
        `<div class="slot win"><span class="seed">${t.seed}</span>${duo(t)}` +
        `<span class="team"><div class="nm">${escapeHtml(t.a)}` +
          (t.b ? `<span class="plus">+</span>${escapeHtml(t.b)}` : "") + `</div>` +
          `<div class="sub">чемпионы турнира</div></span>` +
        (t.rate != null ? `<span class="rate">${t.rate.toFixed(2)}</span>` : "") +
        `<span class="check">✓</span></div>`;
      col.appendChild(card);
      el.bracket.appendChild(col);
    }

    el.stTeams.textContent = state.teams.length;
    el.stRounds.textContent = R;
    renderSeedList();
    requestAnimationFrame(drawLinks);
  }

  /* таблица «Пара — Композит» в панели */
  function renderSeedList(){
    el.seedlist.innerHTML = state.teams.length
      ? state.teams.map(t =>
          `<div class="r"><i>${t.seed}</i><span>${escapeHtml(t.name)}</span>` +
          `<em>${t.rate != null ? t.rate.toFixed(2) : "—"}</em></div>`).join("")
      : `<div class="r"><span style="color:var(--muted)">Сетка ещё не построена</span></div>`;
  }

  /* ---------------- линии ---------------- */
  function drawLinks(){
    el.bracket.querySelector("svg.links")?.remove();
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "links");
    const base = el.bracket.getBoundingClientRect();

    const rectOf = (r, i) => {
      const n = el.bracket.querySelector(`.match[data-r="${r}"][data-i="${i}"]`);
      if (!n) return null;
      const b = n.getBoundingClientRect();
      return { x:(b.left - base.left)/zoom, y:(b.top - base.top)/zoom, w:b.width/zoom, h:b.height/zoom };
    };

    state.rounds.forEach((round, r) => {
      if (!state.rounds[r + 1]) return;
      round.forEach((m, i) => {
        const a = rectOf(r, i), b = rectOf(r + 1, Math.floor(i / 2));
        if (!a || !b) return;
        const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
        const mid = x1 + (x2 - x1) / 2;
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
        if (m.win !== null) p.setAttribute("class", "done");
        svg.appendChild(p);
      });
    });
    el.bracket.prepend(svg);
  }

  /* ---------------- действия ---------------- */
  function simulate(){
    if (!state.rounds.length) return;
    state.rounds.forEach((round, r) => round.forEach((m, i) => {
      if (m.p[0] && m.p[1] && m.win === null) {
        // при наличии композита он даёт перевес, но апсеты возможны
        const ra = m.p[0].rate, rb = m.p[1].rate;
        let pa = .5;
        if (ra != null && rb != null && ra + rb > 0) pa = .25 + .5 * (ra / (ra + rb));
        m.win = Math.random() < pa ? 0 : 1;
        promote(r, i);
      }
    }));
    render(); save();
  }

  function clearWins(){
    if (!state.rounds.length) return;
    state.rounds.forEach((round, r) => round.forEach(m => {
      if (r > 0) m.p = [null, null];
      m.win = null; m.bye = false;
    }));
    autoByes(); render(); save();
  }

  function shuffle(){
    const lines = el.names.value.split("\n").map(s => s.trim()).filter(Boolean);
    for (let i = lines.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lines[i], lines[j]] = [lines[j], lines[i]];
    }
    el.names.value = lines.join("\n");
    if (el.mode.value === "rate") el.mode.value = "seed";
    updateCount(); build();
  }

  function updateCount(){
    const t = parseTeams();
    const solo = t.filter(x => !x.b).length;
    el.cnt.textContent = t.length < 2
      ? "Минимум 2 команды"
      : `${t.length} команд → сетка на ${nextPow2(t.length)}` +
        (nextPow2(t.length) - t.length ? `, ${nextPow2(t.length) - t.length} bye` : "") +
        (solo ? ` · без пары: ${solo}` : "");
  }

  const setZoom = z => {
    zoom = Math.min(1.6, Math.max(.45, z));
    el.zoomer.style.transform = `scale(${zoom})`;
  };

  /* ---------------- хранение ---------------- */
  const save = () => {
    try {
      localStorage.setItem("teamBracket", JSON.stringify({
        names: el.names.value, mode: el.mode.value, teams: state.teams, rounds: state.rounds
      }));
    } catch (e) {}
  };
  function load(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem("teamBracket") || "null"); } catch (e) {}
    if (d && d.rounds && d.rounds.length) {
      el.names.value = d.names; el.mode.value = d.mode || "rate";
      state = { teams: d.teams || [], rounds: d.rounds };
      updateCount(); render();
    } else {
      el.names.value = DEFAULT;
      updateCount(); build();
    }
  }

  /* ---------------- события ---------------- */
  $("#generate").onclick  = build;
  $("#shuffle").onclick   = shuffle;
  $("#simulate").onclick  = simulate;
  $("#clearWins").onclick = clearWins;
  $("#printBtn").onclick  = () => window.print();
  $("#zoomIn").onclick    = () => setZoom(zoom + .15);
  $("#zoomOut").onclick   = () => setZoom(zoom - .15);
  $("#toggleSide").onclick = () => el.side.classList.toggle("hidden");
  $("#theme").onclick = () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", dark ? "light" : "dark"); } catch (e) {}
  };
  $("#exportJson").onclick = async () => {
    const data = JSON.stringify({ teams: state.teams, rounds: state.rounds }, null, 2);
    try { await navigator.clipboard.writeText(data); toast("JSON скопирован в буфер"); }
    catch (e) { toast("Не удалось скопировать"); }
  };
  el.names.addEventListener("input", updateCount);
  el.mode.addEventListener("change", build);
  window.addEventListener("resize", () => requestAnimationFrame(drawLinks));

  try {
    const t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
    else if (matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.dataset.theme = "dark";
  } catch (e) {}

  load();
})();
</script>
</body>
</html>
